name: CI

# Chạy cho mọi pull request và push lên main: analyze + Flutter test + unit
# test Kotlin. Không cần secret (không build bản release).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # Generated l10n is committed; fail if it drifted from app_vi.arb
      - name: Check generated l10n is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - run: flutter analyze
      - run: flutter test

  android-unit:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # gradlew is not committed (Flutter convention) — this generates it
      - run: flutter build apk --config-only
      - name: ./gradlew :app:testDebugUnitTest
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
