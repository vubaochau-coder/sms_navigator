name: CI

# Chạy cho mọi pull request và push lên main: analyze + Flutter test + unit
# test Kotlin + build release (R8). Không cần secret — release ký debug key.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # Generated l10n is committed; fail if it drifted from app_vi.arb
      - name: Check generated l10n is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      # Lỗi hiện thành annotation trên PR (đọc được cả khi không mở log)
      - name: flutter analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          grep -E '^\s*(error|warning|info) • ' analyze.txt | head -50 | sed 's/^ *//; s/^/::error::/'
          exit $status
      - name: flutter test
        if: success() || failure()
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          status=$?
          cat test.txt
          if [ $status -ne 0 ]; then
            grep -E '\[E\]|Error:|Expected:|Actual:|^\s+Which:|Some tests failed|error •' test.txt | head -60 | sed 's/^ *//; s/^/::error::/'
          fi
          exit $status

  android-unit:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # gradlew is not committed (Flutter convention) — this generates it
      - run: flutter build apk --config-only
      - name: ./gradlew :app:testDebugUnitTest
        working-directory: android
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon > gradle.txt 2>&1
          status=$?
          cat gradle.txt
          if [ $status -ne 0 ]; then
            # Lỗi compile Kotlin ("e: file:///…") + test hỏng → annotation
            grep -E '^e: |FAILED|What went wrong|BUILD FAILED|error:|Exception|expected:' gradle.txt | head -40 | sed 's/^/::error::/'
          fi
          exit $status

  android-release:
    # Lỗi R8 (xoá lớp/constructor dùng qua reflection) chỉ lộ ở bản release:
    # bản 22 crash lúc mở, bản 23 không chạy worker. Build release ở mỗi PR
    # và kiểm tra các constructor WorkManager tạo bằng reflection còn trong APK.
    name: Release build (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Reflective constructors survived R8
        run: |
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" dex packages build/app/outputs/flutter-apk/app-release.apk > dex.txt
          status=0
          for sig in \
            'androidx.work.impl.WorkDatabase_Impl <init>()' \
            'androidx.work.OverwritingInputMerger <init>()' \
            'com.example.sms_navigator.worker.OtpRelayWorker <init>(android.content.Context,androidx.work.WorkerParameters)'; do
            if grep -qF "$sig" dex.txt; then echo "✅ $sig"; else echo "::error::R8 đã xoá $sig"; status=1; fi
          done
          exit $status
