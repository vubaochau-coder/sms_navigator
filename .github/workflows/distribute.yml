name: Distribute to Firebase App Tester

# Ký bằng release keystore lấy từ GitHub Secrets — KHÔNG BAO GIỜ bằng debug key
# của runner (mỗi lần chạy một key mới → APK không cài đè được, App Links hỏng).
#
# Secrets cần có (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 của file .jks
#                              (macOS: base64 -i ~/.android/sms-navigator-release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD  storePassword trong android/key.properties (= keyPassword)
#   ANDROID_KEY_ALIAS          keyAlias (mặc định "upload")
#   FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
# Thiếu keystore → job dừng trước khi build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes cho bản build'
        required: false
        default: 'Manual release trigger via GitHub Actions'
      tester_group:
        description: 'Nhóm Tester (internal-dev / field-testers)'
        required: false
        default: 'internal-dev'

jobs:
  distribute:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — không build bản ký debug key."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=$KEYSTORE"
          } > android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # Chỉ tạo file credentials + cấu hình gcloud dùng nó. Không dùng
      # `token_format: access_token`: cách đó đi qua IAM Service Account
      # Credentials API (phải bật riêng trong project). Với key JSON, gcloud
      # tự đổi lấy token qua OAuth, không cần API đó.
      - name: Authenticate to Google for Firebase API
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}

      - name: Determine Version & Auto-Increment Build Number
        id: version
        run: |
          # Build number = max(pubspec, bản mới nhất trên Firebase) + 1 — cùng
          # quy tắc với scripts/distribute.sh. Không hỏi được Firebase thì DỪNG:
          # đoán số dễ trùng hoặc nhảy số so với bản tester đang cài.
          VERSION_RAW=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          VERSION_NAME=${VERSION_RAW%%+*}
          PUBSPEC_BUILD=$(echo "$VERSION_RAW" | cut -s -d'+' -f2)
          PUBSPEC_BUILD=${PUBSPEC_BUILD:-0}
          APP_ID="1:510867121628:android:8e0205deb80aa79c565b19"
          PROJECT_NUMBER="510867121628"

          if ! ACCESS_TOKEN=$(gcloud auth print-access-token); then
            echo "::error::Không lấy được access token từ service account (FIREBASE_SERVICE_ACCOUNT_CREDENTIALS)."
            exit 1
          fi
          if ! RESPONSE=$(curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases?pageSize=1"); then
            echo "::error::Không gọi được Firebase App Distribution API (service account thiếu quyền hoặc API chưa bật) — dừng để không phát hành sai build number."
            exit 1
          fi
          if ! LAST_BUILD=$(echo "$RESPONSE" | jq -er '.releases[0].buildVersion // ""'); then
            echo "::error::Phản hồi của Firebase không đọc được: $RESPONSE"
            exit 1
          fi

          if [ -z "$LAST_BUILD" ]; then
            echo "ℹ️ Firebase chưa có bản nào — dùng pubspec ($PUBSPEC_BUILD)"
            LAST_BUILD=0
          elif ! [[ "$LAST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::buildVersion trên Firebase không phải số: '$LAST_BUILD'"
            exit 1
          fi

          BASE_BUILD=$(( LAST_BUILD > PUBSPEC_BUILD ? LAST_BUILD : PUBSPEC_BUILD ))
          NEW_BUILD=$(( BASE_BUILD + 1 ))
          echo "🔥 Firebase = $LAST_BUILD, pubspec = $PUBSPEC_BUILD → build $NEW_BUILD"

          echo "build_number=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Verify APK is signed with the release keystore
        run: |
          OUTPUT="$(./scripts/print_android_sha256.sh build/app/outputs/flutter-apk/app-release.apk)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '✅ APK ký bằng release keystore' || {
            echo "::error::APK không ký bằng release keystore — dừng phát hành."
            exit 1
          }

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:510867121628:android:8e0205deb80aa79c565b19
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: ${{ github.event.inputs.tester_group || 'internal-dev' }}
          releaseNotes: "[v${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}] ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Release via GitHub Actions' }}"
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
